<script>
/* Rede de segurança: se o script principal falhar, o convite não fica preso na abertura */
window.addEventListener('error', function () {
  try {
    if (window.__pronto) return;
    document.body.className = '';
    var i = document.getElementById('intro'); if (i && i.parentNode) i.parentNode.removeChild(i);
    var a = document.getElementById('app');
    if (a && !a.innerHTML) a.innerHTML = '<p style="padding:60px 24px;text-align:center;font-family:serif;color:#8A4E5B">Não foi possível carregar o convite neste navegador.<br>Abra o link no Chrome ou no Safari.</p>';
  } catch (e) {}
});
</script>

<style>
/* ===== ESTILO (não precisa mexer: cores, fontes e links ficam no CONFIG lá embaixo) ===== */
:root{
  --fundo:#FBF3F5; --card:#FFFAFB; --secaoAlt:#F7E6EA;
  --claro:#F1CCD4; --rosa:#E6A9BA; --antigo:#D299A2; --salmao:#E3A1A8;
  --enfase:#8A4E5B; --texto:#5E2F3A; --textoSuave:#85535F; --textoClaro:#FFF7F8;
  --textoForte:#3E1C26; --textoMedio:#4A2530;
  --f-tit:'Playfair Display',serif; --f-script:'Pinyon Script',cursive; --f-corpo:'Raleway',sans-serif;
  --btn-rgb:241,204,212; --btn-txt:#7A3F4C; --btn-op:.9; --btn-raio:99px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--fundo);color:var(--textoForte);font-family:var(--f-corpo);font-weight:500;font-size:17px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
body.locked,body.modal-aberto{overflow:hidden}
img,video,iframe{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h2{font-family:var(--f-tit);font-weight:600;font-size:2.3rem;line-height:1.2;text-align:center;color:var(--enfase)}
h3{font-family:var(--f-tit);font-weight:600;font-size:1.7rem;line-height:1.25;color:var(--enfase)}
.script{font-family:var(--f-script);font-weight:400;font-size:2.3rem;line-height:1.1}
.sub{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--textoForte);font-weight:700;margin-bottom:4px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 18px;color:var(--antigo);font-size:14px}
.orn::before,.orn::after{content:"";width:44px;height:1px;background:var(--antigo)}
.texto{font-size:1.2rem;color:var(--textoMedio);font-weight:500;line-height:1.65}
.data{font-family:var(--f-corpo);font-weight:700;font-size:1.3rem;color:var(--textoForte)}
.data-capa{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.3}

section.sec{padding:46px 22px;position:relative;overflow:hidden}
.bg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.veu{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1}
.wrap,.capa-card{position:relative;z-index:2}
section.alt{background:var(--secaoAlt)}
.wrap{max-width:680px;margin:0 auto;text-align:center}
.ev{margin-top:26px}
.ev+.ev{padding-top:26px;border-top:1px solid var(--antigo)}
.ev h3{margin-bottom:4px}
.ev-card{position:relative;overflow:hidden;margin-top:20px;padding:28px 20px;border:1px solid var(--antigo)}
.ev-conteudo{position:relative;z-index:2}
.ev-card .sub{margin-bottom:6px}
.ev-nome{font-family:var(--f-tit);font-weight:600;font-size:1.9rem;line-height:1.15;color:var(--enfase);margin-bottom:8px}
.ev-card .btn{margin-top:16px}

/* BOTÕES — apenas contorno e texto, sem preenchimento (cores no CONFIG.botoes) */
.btn,.rsvp-ico,#musicBtn,.pix-num{
  background:transparent;color:var(--btn-txt);
  border:2px solid var(--btn-borda,var(--btn-txt));box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:15px 38px;border-radius:var(--btn-raio);
  text-decoration:none;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;transition:transform .2s}
.btn:active,.pix-num:active{transform:scale(.97)}
.texto+.btn-abrir{margin-top:22px}

.dress-img{width:100%;max-width:360px;margin:18px auto 6px;border-radius:20px;border:3px solid var(--antigo);box-shadow:0 10px 26px rgba(138,78,91,.2);object-fit:cover}
.foto{width:100%;max-width:420px;aspect-ratio:2/3;object-fit:cover;margin:24px auto 8px;
  border-radius:140px 140px 6px 6px;border:3px solid var(--antigo);padding:6px;background:var(--card);
  outline:1px solid var(--rosa);outline-offset:6px;box-shadow:0 12px 30px rgba(138,78,91,.25)}

/* GALERIA — mosaico (blocos de 4 fotos) */
.mosaico{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.mos-bloco{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(20,minmax(0,1fr));gap:8px;aspect-ratio:1/1.1;height:auto}
.mos-bloco>:nth-child(1){grid-area:1/1/14/2}
.mos-bloco>:nth-child(2){grid-area:1/2/11/3}
.mos-bloco>:nth-child(3){grid-area:14/1/21/2}
.mos-bloco>:nth-child(4){grid-area:11/2/21/3}
.mos-bloco.esp{grid-template-columns:1fr 2fr}
.mos-bloco.esp>:nth-child(1){grid-area:1/2/14/3}
.mos-bloco.esp>:nth-child(2){grid-area:1/1/11/2}
.mos-bloco.esp>:nth-child(3){grid-area:14/2/21/3}
.mos-bloco.esp>:nth-child(4){grid-area:11/1/21/2}
.mos-f{position:relative;overflow:hidden;min-width:0;min-height:0;border:2px solid var(--antigo);background:var(--card);box-shadow:0 6px 16px rgba(138,78,91,.18);padding:0}
.mos-f img{position:absolute;top:0;left:0;width:100%;height:100%;max-width:none;object-fit:cover;transition:transform .5s}
.mos-f:active img{transform:scale(1.04)}
#lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:400;background:rgba(40,16,24,.95);display:none;align-items:center;justify-content:center;padding:56px 12px}
#lb.on{display:flex}
#lbImg{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-select:none}
#lb button{position:absolute;color:#fff;background:rgba(255,255,255,.14);border-radius:50%;width:44px;height:44px;font-size:1.9rem;line-height:1;display:grid;place-items:center}
#lbX{top:calc(10px + env(safe-area-inset-top,0px));right:12px}
#lbP{left:8px;top:50%;margin-top:-22px}
#lbN{right:8px;top:50%;margin-top:-22px}
#lbC{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:.85rem;letter-spacing:.2em;pointer-events:none}

.cores{display:flex;gap:12px;justify-content:center;margin-top:18px}
.cores i{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2)}

#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--enfase);
  background:var(--claro) center/cover no-repeat;transition:transform 1.1s cubic-bezier(.77,0,.18,1),opacity .8s}
#intro.open{transform:translateY(-100%);opacity:0}
#introVid{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;z-index:10;background:transparent;opacity:0;pointer-events:none;transition:opacity .25s}
#introVid.pronto{opacity:1;pointer-events:auto}
.selo{width:104px;height:104px;border-radius:50%;background:var(--enfase);color:var(--textoClaro);border:3px solid var(--card);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;font-weight:600}
.selo-clique{width:130px;height:130px;border-radius:50%;background:transparent}
#intro .toque{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom,0px));z-index:5;
  width:min(36vw,170px);height:auto;transform:translateX(-50%);pointer-events:none;
  filter:drop-shadow(0 5px 10px rgba(94,47,58,.35));opacity:0;animation:surge 1s ease 2.5s forwards,pulsa 2.2s ease-in-out 3.5s infinite}
@keyframes pulsa{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
@keyframes surge{to{opacity:1}}
#intro .dica{position:absolute;bottom:calc(9% + env(safe-area-inset-bottom,0px));z-index:5;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;
  font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--enfase);padding:14px 30px;border-radius:99px;
  box-shadow:0 6px 16px rgba(138,78,91,.4);opacity:0;animation:surge 1s ease 2.5s forwards;pointer-events:none}

.hero{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:36px 20px;background:var(--fundo) center/cover no-repeat}
.capa-card{width:100%;max-width:620px;text-align:center;padding:10px 6px}
.capa-card .nome{font-family:var(--f-script);font-size:clamp(2.8rem,14vw,4rem);line-height:1.05;color:var(--enfase);margin:8px 0}
.capa-card .sub{font-size:.95rem;line-height:1.9}
.capa-card .logo-nome{width:92%;max-width:480px;margin:14px auto}
.frase{font-family:var(--f-corpo);font-size:clamp(1.25rem,4.6vw,1.7rem);font-weight:600;color:var(--textoForte);margin:22px 0 8px;line-height:1.5}

.escuro{padding:56px 22px}
#contagem{background-color:var(--ct-fundo,var(--enfase))}
#contagem h2{color:var(--ct-titulo,var(--textoClaro))}
#contagem .sub{color:var(--ct-sub,var(--claro))}
.renda{position:absolute;left:0;right:0;z-index:3;background-repeat:repeat-x;background-position:center top;background-size:auto 100%;pointer-events:none}
.renda.topo{top:0}
.renda.base{bottom:0;transform:scaleY(-1)}
.cd{display:flex;justify-content:center;margin-top:20px}
.cd>div{margin:0 8px}
.cd b{display:block;font-family:var(--f-corpo);font-weight:700;font-size:2.4rem;line-height:1;margin-bottom:6px;color:var(--ct-num,var(--textoClaro))}
.cd span{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ct-rot,var(--claro))}

.tl{position:relative;text-align:left;--col:104px}
.tl::before{content:"";position:absolute;left:calc(var(--col) + 19px);top:10px;bottom:10px;width:1px;background:var(--antigo)}
.tl-i{display:grid;grid-template-columns:var(--col) 18px 1fr;gap:10px;margin-bottom:22px;align-items:start}
.tl-h{font-family:var(--f-corpo);font-weight:700;font-size:1.4rem;color:var(--textoForte);text-align:right;line-height:1.1}
.tl-h small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--textoMedio);margin-top:4px}
.tl-d{color:var(--antigo);font-size:.8rem;text-align:center}
.tl-t b{display:block;font-family:var(--f-tit);font-weight:600;font-size:1.3rem;color:var(--enfase);margin-bottom:2px}
.tl-t span{font-size:1rem;font-weight:500;color:var(--textoMedio)}
.tl-t em{display:block;margin-top:6px;font-style:normal;font-weight:700;color:var(--enfase)}

/* MOLDURA DO VÍDEO + RENDA NOS CANTOS (imagens no CONFIG.mensagem.videoRenda) */
.video-frame{position:relative;max-width:460px;margin:24px auto 0;border:3px solid var(--antigo);box-shadow:0 10px 26px rgba(138,78,91,.2);background:#000}
.video-frame video{width:100%;max-height:80vh;display:block}
.video-frame .canto{position:absolute;width:var(--vr,110px);height:auto;max-width:none;pointer-events:none;z-index:3}
.video-frame .canto.sd{top:-8px;right:-8px}
.video-frame .canto.ie{bottom:-8px;left:-8px}
.video-frame .canto.gira{transform:rotate(180deg)}

.rsvp-ico{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:14px auto 4px}
button.rsvp-ico{cursor:pointer;animation:anel 2.6s ease-out infinite;transition:transform .2s}
button.rsvp-ico:active{transform:scale(.94)}
@keyframes anel{0%{box-shadow:0 0 0 0 rgba(210,153,162,.65)}70%,100%{box-shadow:0 0 0 20px rgba(210,153,162,0)}}
.rsvp-ico svg{width:40px;height:40px}
.rsvp-ico img{width:44px;height:44px;object-fit:contain}
.rsvp-form{max-width:460px;margin:0 auto;text-align:left}
.rsvp-form label{display:block;font-weight:700;font-size:1.05rem;margin:16px 0 8px;color:var(--textoForte)}
.rsvp-form input,.rsvp-form textarea{width:100%;font:inherit;font-size:1.1rem;font-weight:500;padding:14px 16px;border:2px solid var(--antigo);border-radius:12px;background:var(--card);color:var(--textoForte);outline:none}
.rsvp-form input:focus,.rsvp-form textarea:focus{border-color:var(--enfase)}
.rsvp-form textarea{resize:vertical}
.rsvp-erro{margin-top:10px;font-weight:700;color:#A12B3C}
.rsvp-form .btn{display:flex;width:100%;margin-top:22px}

.janela-fundo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:300;background:rgba(62,28,38,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.janela-fundo.on{display:flex}
.janela{position:relative;width:min(440px,100%);max-height:88vh;max-height:88svh;overflow:auto;background:var(--card);border:1px solid var(--antigo);border-radius:26px;padding:44px 24px 28px;text-align:center;box-shadow:0 20px 50px rgba(62,28,38,.35);animation:pop .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.janela-x{position:absolute;top:8px;right:10px;width:42px;height:42px;border-radius:50%;font-size:1.8rem;line-height:1;color:var(--enfase)}
.janela .orn{margin:10px auto 18px}
.janela .pix{margin-top:20px}

footer{position:relative;overflow:hidden;background:var(--enfase);color:var(--textoClaro);text-align:center;padding:44px 20px calc(44px + env(safe-area-inset-bottom,0px))}
footer .script{font-size:2.8rem}
footer p{letter-spacing:.2em;font-size:.8rem;color:var(--claro);margin-top:10px}
#musicBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;width:46px;height:46px;border-radius:50%;font-size:1.1rem;display:grid;place-items:center}
#musicBtn.tocando{animation:giro 6s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
#ytwrap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#barra-inf{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);z-index:119;pointer-events:none}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.logo-nome{display:block;width:80%;max-width:300px;height:auto;margin:10px auto}
.logo-nome.branca{filter:brightness(0) invert(1)}
.logo-msg{margin:0 0 0 50%;transform:translateX(-50%);width:min(var(--lw,460px),calc(100vw - 16px));max-width:none}
.presente-lista{margin-top:16px}
.presente-lista p{padding:14px 0;border-bottom:1px solid var(--rosa)}
.presente-lista p:last-child{border-bottom:none}
.pix{margin-top:22px;padding:24px 18px;border:1px solid var(--antigo);background:var(--card)}
.pix .sub{font-size:.9rem}
.pix-num{display:block;width:100%;margin:10px 0 8px;padding:16px 10px;border-radius:18px;font-family:Arial,Helvetica,sans-serif;font-size:clamp(1.15rem,5vw,1.5rem);font-weight:700;letter-spacing:.05em;color:var(--btn-txt);transition:transform .2s}
.pix-dica{font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--enfase)}
.deslize{margin-top:18px;display:flex;flex-direction:column;align-items:center}
.deslize span{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.deslize svg{width:20px;height:20px;margin-top:2px;animation:desce 1.6s ease-in-out infinite}
@keyframes desce{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(6px);opacity:1}}
@supports not (aspect-ratio:1/1){
  .mos-bloco{height:520px}
  .foto{height:400px}
}
</style>
</head>

<script>

  capa: {

(function (o) {
  var pages = /\.github\.io$/i.test(location.hostname);
  var rx = /^https:\/\/github\.com\/[^\/]+\/[^\/]+\/(?:blob|raw)\/[^\/]+\/(.+?)(?:\?raw=true)?$/i;
  var ext = /\.(png|jpe?g|gif|webp|svg|mp4|webm|mov|m4v|mp3|woff2?|ttf|otf)$/i;
  (function walk(x) {
    for (var k in x) {
      var v = x[k];
      if (typeof v === 'string') {
        var m = pages ? v.match(rx) : null;
        if (m) x[k] = m[1];
        else if (!/^(https?:|data:|\/\/)/i.test(v) && ext.test(v)) x[k] = encodeURI(v);
      } else if (v && typeof v === 'object') walk(v);
    }
  })(o);
})(CONFIG);

{ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?' + [gf(fTit, 1), gf(fCorpo, 1), gf(fScript, 0)].join('&') + '&display=swap'; document.head.appendChild(l); }

function alturaRenda(w, h, min, max) { return Math.round(Math.min(max, Math.max(min, (C.rendaTile || 360) * h / w))); }
function ajustarRendas() {

  });
}

const carregar = src => new Promise(ok => {

    v.addEventListener('waiting', () => { clearTimeout(espera); espera = setTimeout(entrar, 6000); });
    v.onended = v.onclick = v.onerror = entrar;

if (fotosG.length) {
  const blocos = [];
  for (let i = 0; i < fotosG.length; i += 4) blocos.push(fotosG.slice(i, i + 4));
  sec('galeria', 'Galeria', `${tit(GA.titulo || 'Galeria')}<div class="mosaico">${blocos.map((b, bi) => `<div class="mos-bloco${bi % 2 ? ' esp' : ''}">${b.map((g, j) => { const n = bi * 4 + j; return `<button class="mos-f" type="button" data-i="${n}" aria-label="Abrir foto ${n + 1}"><img src="${g.src}" alt="Foto ${n + 1}" loading="lazy" style="object-position:${g.foco || 'center'}"></button>`; }).join('')}</div>`).join('')}</div>`, 'alt');
}

if (C.local) sec('local', 'Local', tit(C.local.titulo) + ev.map(e => {
  const d = new Date(e.dataHora), q = [e.espaco, e.endereco, C.cidade].filter(Boolean).join(' ');
  return `<div class="ev-card"${corSec(e)}>${fundoHTML(e, 'var(--secaoAlt)')}<div class="ev-conteudo"><p class="sub">${e.titulo}</p><h3 class="ev-nome">${e.espaco}</h3>
    <p class="data">${cap(fm(d, { weekday: 'long' }))}, ${fm(d, { day: 'numeric', month: 'long' })} · ${hora(d)}</p>
    ${e.endereco ? `<p class="texto" style="margin-top:8px">${e.endereco}</p>` : ''}
    <a class="btn" href="${e.mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + enc(q)}" target="_blank" rel="noopener">Como chegar</a></div></div>`;
}).join(''), 'alt');

const H = C.hospedagem;
if (H) sec('hospedagem', 'Hospedagem', `${tit(H.titulo)}<p class="texto">${H.texto}</p>` + H.lista.map(h => `<div class="ev">${h.imagem ? `<img src="${h.imagem}" alt="${h.nome}" style="margin-bottom:14px">` : ''}<h3>${h.nome}</h3><a class="btn" style="margin-top:14px" href="${h.link}" target="_blank" rel="noopener">${h.botao || 'Saiba mais'}</a></div>`).join(''));

/* Dress Code (logo abaixo da Hospedagem) */
const D = C.dressCode, coresD = D ? (D.cores || []).filter(Boolean) : [], temD = D && D.usar !== false && (D.texto || D.traje || D.imagem || coresD.length);
const imgD = D && D.imagem ? `<img class="dress-img" src="${D.imagem}" alt="${D.titulo}" onerror="this.style.display='none'">` : '';
const corpoD = () => `${D.traje ? `<h3>${D.traje}</h3>` : ''}${D.texto ? `<p class="texto" style="margin-top:12px">${D.texto}</p>` : ''}${coresD.length ? `<div class="cores">${coresD.map(c => `<i style="background:${c}"></i>`).join('')}</div>` : ''}`;
if (temD) sec('traje', 'Traje', tit(D.titulo) + imgD + (D.abrirEmJanela !== false
  ? `${D.introducao ? `<p class="texto" style="margin-top:14px">${D.introducao}</p>` : ''}<button class="btn btn-abrir" id="abrirTraje" type="button">${D.botao || 'Ver Dress Code'}</button>`
  : corpoD()));

/* Presentes */
const G = C.presentes, listaG = G ? (G.itens || []).length : 0;
const corpoG = () => `${listaG ? `<div class="presente-lista">${G.itens.map(i => `<p class="texto">${i}</p>`).join('')}</div>` : ''}${G.pix ? `<div class="pix"><p class="sub">Chave Pix</p><button class="pix-num" id="copiarPix" type="button" aria-label="Copiar chave Pix">${G.pixTexto || G.pix}</button><p class="pix-dica" id="pixDica">Toque na chave para copiar</p></div>` : ''}`;
if (G && (G.texto || listaG || G.pix)) sec('presentes', 'Presentes', tit(G.titulo, G.subtitulo) + (G.texto ? `<p class="texto">${G.texto}</p>` : '') + (G.abrirEmJanela !== false
  ? `<button class="btn btn-abrir" id="abrirPresentes" type="button">${G.botao || 'Ver sugestões'}</button>`
  : corpoG()), 'alt');

/* Confirmar presença */
const R = C.rsvp, janR = R && R.abrirEmJanela !== false;
const iconeR = R ? (R.iconeImagem ? `<img src="${R.iconeImagem}" alt="">` : ICONE_OK) : '';
const formR = () => `<div class="rsvp-form">
    <label for="rsvpNome">${R.rotuloNome}</label>
    <input id="rsvpNome" type="text" autocomplete="name" placeholder="${R.placeholderNome}">
    <label for="rsvpAcomp">${R.rotuloAcomp}</label>
    <textarea id="rsvpAcomp" rows="3" placeholder="${R.placeholderAcomp}"></textarea>
    <p class="rsvp-erro" id="rsvpErro" hidden>${R.avisoNome}</p>
    <button class="btn" id="rsvpEnviar" type="button">${R.botao}</button>
  </div>`;
if (R) sec('confirmar', 'Confirmar', tit(R.titulo) + (janR
  ? `<p class="texto">${R.instrucao}</p><button class="rsvp-ico" id="abrirRsvp" type="button" aria-label="${R.titulo}">${iconeR}</button>`
  : `<div class="rsvp-ico" aria-hidden="true">${iconeR}</div><p class="texto" style="margin:14px 0 8px">${R.instrucao}</p>${formR()}`), 'alt');

$('#app').innerHTML = capa + secoes.join('') + `<footer>${rendaHTML(C.rodape)}${nomeHTML('script', true, C.logoRodape)}<p>${C.hashtag}</p></footer>`;

window.__pronto = true;

/* copiar chave Pix (toque na própria chave) */
const bindPix = r => {
  const cp = $('#copiarPix', r); if (!cp) return;
  const dica = $('#pixDica', r);
  cp.onclick = () => {
    const txt = C.presentes.pix, ok = () => { if (dica) { dica.textContent = 'Chave copiada!'; setTimeout(() => { dica.textContent = 'Toque na chave para copiar'; }, 2500); } };
    const alt = () => { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, alt); else alt();
  };
};

/* confirmar presença → WhatsApp */
const bindRsvp = r => {
  const envia = $('#rsvpEnviar', r); if (!envia) return;
  envia.onclick = () => {
    const nome = $('#rsvpNome', r).value.trim(), acomp = $('#rsvpAcomp', r).value.trim().replace(/\n+/g, ', '), erro = $('#rsvpErro', r);
    if (!nome) { erro.hidden = false; $('#rsvpNome', r).focus(); return; }
    erro.hidden = true;
    const msg = (R.mensagemWhats || '').replace('{nome}', () => nome).replace('{acompanhantes}', () => acomp || 'sem acompanhantes'),
      num = (R.whatsapp || '').replace(/\D/g, '');
    window.open('https://wa.me/' + num + '?text=' + enc(msg), '_blank');
  };
};

const bTraje = $('#abrirTraje'), bPres = $('#abrirPresentes'), bRsvp = $('#abrirRsvp');
if (bTraje) bTraje.onclick = () => abreJ(`<p class="sub">${D.titulo}</p><div class="orn">♥</div>${corpoD()}`);
if (bPres) bPres.onclick = () => abreJ(`<h3>${G.titulo}</h3><div class="orn">♥</div>${corpoG()}`, bindPix); else bindPix(document);
if (bRsvp) bRsvp.onclick = () => abreJ(`<h3>${R.titulo}</h3><div class="orn">♥</div>${formR()}`, bindRsvp); else bindRsvp(document);

/* Galeria: tela cheia com deslize */
const lb = $('#lb'), lbImg = $('#lbImg'), lbC = $('#lbC'); let lbI = 0, lbX0 = 0;
const lbMostra = i => { if (!fotosG.length) return; lbI = (i + fotosG.length) % fotosG.length; lbImg.src = fotosG[lbI].src; lbC.textContent = (lbI + 1) + ' / ' + fotosG.length; };
const lbAbre = i => { lbMostra(i); lb.classList.add('on'); document.body.classList.add('modal-aberto'); };
const lbFecha = () => { lb.classList.remove('on'); document.body.classList.remove('modal-aberto'); lbImg.removeAttribute('src'); };
document.querySelectorAll('.mos-f').forEach(b => b.onclick = () => lbAbre(+b.dataset.i));
$('#lbX').onclick = lbFecha; $('#lbP').onclick = () => lbMostra(lbI - 1); $('#lbN').onclick = () => lbMostra(lbI + 1);
lb.onclick = e => { if (e.target === lb) lbFecha(); };
lb.addEventListener('touchstart', e => { lbX0 = e.changedTouches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - lbX0; if (Math.abs(dx) > 50) lbMostra(lbI + (dx < 0 ? 1 : -1)); }, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { fechaJ(); lbFecha(); }
  if (lb.classList.contains('on')) { if (e.key === 'ArrowRight') lbMostra(lbI + 1); if (e.key === 'ArrowLeft') lbMostra(lbI - 1); }
});

/* vídeo da mensagem: pausa a música ao dar play */
const vm = $('#videoMaria');
if (vm) {
  let retomar = false;
  vm.addEventListener('play', () => { if (tocando) { retomar = true; pausar(); } });
  const volta = () => { if (vm.seeking || !retomar) return; retomar = false; tocar(); };
  vm.addEventListener('pause', volta);
  vm.addEventListener('ended', volta);
}

try { ajustarRendas(); } catch (e) {}

/* vídeos de fundo que tocam uma vez só */
document.querySelectorAll('video[data-uma-vez]').forEach(v => {
  v.muted = true;
  const play = () => v.play().catch(() => {});
  const antes = parseFloat(v.dataset.antes) || 0;
  if (antes) {
    let vigia = false;
    const checar = () => {
      if (v.paused || v.ended) { vigia = false; return; }
      if (v.duration && v.currentTime >= v.duration - antes) { v.pause(); vigia = false; return; }
      requestAnimationFrame(checar);
    };
    v.addEventListener('playing', () => { if (!vigia) { vigia = true; requestAnimationFrame(checar); } });
    v.addEventListener('ended', () => { if (v.duration) { v.currentTime = Math.max(0, v.duration - antes - 0.05); v.pause(); } });
  }
  if ('IntersectionObserver' in window) {
    const o = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { play(); o.disconnect(); } }), { threshold: .35 });
    o.observe(v.closest('section') || v);
  } else play();
});

/* Animações de entrada e contagem */
const rvs = document.querySelectorAll('.wrap, footer');
rvs.forEach(e => e.classList.add('rv'));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  rvs.forEach(e => io.observe(e));
} else rvs.forEach(e => e.classList.add('in'));

function contagem() {
  const el = $('#cd'); if (!el) return;
  const dif = d0 - new Date();
  if (dif <= 0) { el.innerHTML = '<span style="font-size:.8rem">É HOJE!</span>'; return; }
  const n = [Math.floor(dif / 864e5), Math.floor(dif % 864e5 / 36e5), Math.floor(dif % 36e5 / 6e4), Math.floor(dif % 6e4 / 1e3)];
  el.innerHTML = n.map((v, i) => `<div><b>${String(v).padStart(2, '0')}</b><span>${['dias', 'horas', 'min', 'seg'][i]}</span></div>`).join('');
}
contagem(); setInterval(contagem, 1000);
</script>
</body>
</html>
