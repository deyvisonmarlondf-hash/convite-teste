<script>
/* Rede de segurança: se o script principal falhar, o convite não fica preso na abertura */
window.addEventListener('error', function () {
  try {
    if (window.__pronto) return;
    document.body.className = '';
    var i = document.getElementById('intro'); if (i && i.parentNode) i.parentNode.removeChild(i);
    var a = document.getElementById('app');
    if (a && !a.innerHTML) a.innerHTML = '<p style="padding:60px 24px;text-align:center;font-family:serif;color:#8A4E5B">Não foi possível carregar o convite neste navegador.<br>Abra o link no Chrome ou no Safari.</p>';
  } catch (e) {}
});
</script>

<style>
/* ===== ESTILO (não precisa mexer: cores, fontes e links ficam no CONFIG lá embaixo) ===== */
:root{
  --fundo:#FBF3F5; --card:#FFFAFB; --secaoAlt:#F7E6EA;
  --claro:#F1CCD4; --rosa:#E6A9BA; --antigo:#D299A2; --salmao:#E3A1A8;
  --enfase:#8A4E5B; --texto:#5E2F3A; --textoSuave:#85535F; --textoClaro:#FFF7F8;
  --textoForte:#3E1C26; --textoMedio:#4A2530;
  --f-tit:'Playfair Display',serif; --f-script:'Pinyon Script',cursive; --f-corpo:'Raleway',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--fundo);color:var(--textoForte);font-family:var(--f-corpo);font-weight:500;font-size:17px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
body.locked{overflow:hidden}
img,video,iframe{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h2{font-family:var(--f-tit);font-weight:600;font-size:2.4rem;line-height:1.2;text-align:center;color:var(--enfase)}
h3{font-family:var(--f-tit);font-weight:600;font-size:1.7rem;color:var(--enfase)}
.script{font-family:var(--f-script);font-weight:400;font-size:2.3rem;line-height:1.1}
.sub{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--textoForte);font-weight:700}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 26px;color:var(--antigo);font-size:14px}
.orn::before,.orn::after{content:"";width:44px;height:1px;background:var(--antigo)}
.texto{font-size:1.2rem;color:var(--textoMedio);font-weight:500;line-height:1.7}
.data{font-family:var(--f-corpo);font-weight:700;font-size:1.3rem;color:var(--textoForte)}
.data-capa{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.3}

section.sec{padding:80px 22px;position:relative;overflow:hidden}
.bg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.veu{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1}
.wrap,.capa-card{position:relative;z-index:2}
section.alt{background:var(--secaoAlt)}
.wrap{max-width:680px;margin:0 auto;text-align:center}
.ev{margin-top:34px}
.ev+.ev{padding-top:34px;border-top:1px solid var(--antigo)}
.ev-card{position:relative;overflow:hidden;margin-top:30px;padding:34px 20px;border:1px solid var(--antigo)}
.ev-conteudo{position:relative;z-index:2}
.ev-nome{font-family:var(--f-tit);font-weight:600;font-size:1.9rem;line-height:1.15;color:var(--enfase)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--enfase);color:#fff;border:2px solid var(--enfase);min-height:54px;padding:16px 38px;border-radius:99px;
  text-decoration:none;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;box-shadow:0 6px 16px rgba(138,78,91,.35);transition:transform .2s}
.btn:active{transform:scale(.97)}

.foto{width:100%;max-width:420px;aspect-ratio:2/3;object-fit:cover;margin:30px auto 8px;
  border-radius:140px 140px 6px 6px;border:3px solid var(--antigo);padding:6px;background:var(--card);
  outline:1px solid var(--rosa);outline-offset:6px;box-shadow:0 12px 30px rgba(138,78,91,.25)}
.gal-wrap{position:relative;width:100%;max-width:460px;margin:0 auto}
.gal-wrap.com-renda{margin:70px auto 60px}
.gal-wrap.com-faixa{margin:40px auto}
.gal-renda{position:absolute;left:50%;top:50%;width:calc(var(--esc,1.3)*100%);max-width:calc(100vw - 8px);height:auto;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.gal-faixa{position:absolute;left:-14px;right:-14px;height:var(--fh,28px);background-repeat:repeat-x;background-position:center;background-size:auto 100%;pointer-events:none;z-index:3}
.gal-faixa.topo{top:calc(var(--fh,28px)/-2)}
.gal-faixa.base{bottom:calc(var(--fh,28px)/-2);transform:scaleY(-1)}
.gal-lado{position:absolute;top:50%;width:calc(100%*4/3 + 28px);height:var(--fh,28px);background-repeat:repeat-x;background-position:center;background-size:auto 100%;pointer-events:none;z-index:3}
.gal-lado.esq{left:0;transform:translate(-50%,-50%) rotate(-90deg)}
.gal-lado.dir{right:0;transform:translate(50%,-50%) rotate(90deg)}

.carrossel{position:relative;width:100%;max-width:460px;aspect-ratio:3/4;margin:0 auto;overflow:hidden;border:3px solid var(--antigo);box-shadow:0 10px 26px rgba(138,78,91,.2)}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .9s}
.slide.ativo{opacity:1;z-index:1}
.slide img{width:100%;height:100%;max-width:none;object-fit:cover}
.pontos{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;gap:6px;justify-content:center}
.pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);transition:.3s}
.pontos i.ativo{background:var(--enfase);transform:scale(1.25)}

.cores{display:flex;gap:12px;justify-content:center;margin-top:20px}
.cores i{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2)}

#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--enfase);
  background:var(--claro) center/cover no-repeat;transition:transform 1.1s cubic-bezier(.77,0,.18,1),opacity .8s}
#intro.open{transform:translateY(-100%);opacity:0}
#introVid{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;z-index:10;background:transparent;opacity:0;pointer-events:none;transition:opacity .25s}
#introVid.pronto{opacity:1;pointer-events:auto}
.selo{width:104px;height:104px;border-radius:50%;background:var(--enfase);color:var(--textoClaro);border:3px solid var(--card);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;font-weight:600}
.selo-clique{width:130px;height:130px;border-radius:50%;background:transparent}
/* faixa "Toque para abrir" (PNG): pequena, por cima da imagem de abertura */
#intro .toque{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom,0px));z-index:5;
  width:min(36vw,170px);height:auto;transform:translateX(-50%);pointer-events:none;
  filter:drop-shadow(0 5px 10px rgba(94,47,58,.35));opacity:0;animation:surge 1s ease 2.5s forwards,pulsa 2.2s ease-in-out 3.5s infinite}
@keyframes pulsa{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
@keyframes surge{to{opacity:1}}
#intro .dica{position:absolute;bottom:calc(9% + env(safe-area-inset-bottom,0px));z-index:5;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;
  font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--enfase);padding:14px 30px;border-radius:99px;
  box-shadow:0 6px 16px rgba(138,78,91,.4);opacity:0;animation:surge 1s ease 2.5s forwards;pointer-events:none}

.hero{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:36px 20px;background:var(--fundo) center/cover no-repeat}
.capa-card{width:100%;max-width:620px;text-align:center;padding:10px 6px}
.capa-card .nome{font-family:var(--f-script);font-size:clamp(2.8rem,14vw,4rem);line-height:1.05;color:var(--enfase);margin:8px 0}
.capa-card .sub{font-size:.95rem;line-height:1.9}
.capa-card .logo-nome{width:92%;max-width:480px}
.frase{font-family:var(--f-corpo);font-size:clamp(1.25rem,4.6vw,1.7rem);font-weight:600;color:var(--textoForte);margin:22px 0 8px;line-height:1.5}

.escuro{background:var(--enfase);color:var(--textoClaro);padding:100px 22px}
.escuro h2{color:var(--textoClaro)}
.escuro .sub{color:var(--claro)}
.renda{position:absolute;left:0;right:0;z-index:3;background-repeat:repeat-x;background-position:center top;background-size:auto 100%;pointer-events:none}
.renda.topo{top:0}
.renda.base{bottom:0;transform:scaleY(-1)}
.cd{display:flex;justify-content:center}
.cd>div{margin:0 8px}
.cd b{display:block;font-family:var(--f-corpo);font-weight:700;font-size:2.4rem;line-height:1}
.cd span{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--claro)}

.tl{position:relative;text-align:left;--col:104px}
.tl::before{content:"";position:absolute;left:calc(var(--col) + 19px);top:10px;bottom:10px;width:1px;background:var(--antigo)}
.tl-i{display:grid;grid-template-columns:var(--col) 18px 1fr;gap:10px;margin-bottom:26px;align-items:start}
.tl-h{font-family:var(--f-corpo);font-weight:700;font-size:1.4rem;color:var(--textoForte);text-align:right;line-height:1.1}
.tl-h small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--textoMedio)}
.tl-d{color:var(--antigo);font-size:.8rem;text-align:center}
.tl-t b{display:block;font-family:var(--f-tit);font-weight:600;font-size:1.3rem;color:var(--enfase)}
.tl-t span{font-size:1rem;font-weight:500;color:var(--textoMedio)}
.tl-t em{display:block;margin-top:4px;font-style:normal;font-weight:700;color:var(--enfase)}

/* Vídeo da mensagem */
.video-frame{position:relative;max-width:460px;margin:34px auto 0;border:3px solid var(--antigo);box-shadow:0 10px 26px rgba(138,78,91,.2);overflow:hidden;background:#000}
.video-frame video{width:100%;max-height:80vh;display:block}

/* Confirmar presença */
.rsvp-ico{width:84px;height:84px;border-radius:50%;background:var(--enfase);color:var(--textoClaro);display:grid;place-items:center;margin:8px auto 4px;border:4px solid var(--claro)}
.rsvp-ico svg{width:40px;height:40px}
.rsvp-ico img{width:44px;height:44px;object-fit:contain}
.rsvp-form{max-width:460px;margin:0 auto;text-align:left}
.rsvp-form label{display:block;font-weight:700;font-size:1.05rem;margin:18px 0 6px;color:var(--textoForte)}
.rsvp-form input,.rsvp-form textarea{width:100%;font:inherit;font-size:1.1rem;font-weight:500;padding:14px 16px;border:2px solid var(--antigo);border-radius:12px;background:var(--card);color:var(--textoForte);outline:none}
.rsvp-form input:focus,.rsvp-form textarea:focus{border-color:var(--enfase)}
.rsvp-form textarea{resize:vertical}
.rsvp-erro{margin-top:10px;font-weight:700;color:#A12B3C}
.rsvp-form .btn{display:flex;width:100%;margin-top:24px}

footer{position:relative;overflow:hidden;background:var(--enfase);color:var(--textoClaro);text-align:center;padding:52px 20px calc(52px + env(safe-area-inset-bottom,0px))}
footer .script{font-size:2.8rem}
footer p{letter-spacing:.2em;font-size:.8rem;color:var(--claro)}
#musicBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--antigo);background:var(--enfase);color:var(--textoClaro);font-size:1.1rem;display:grid;place-items:center}
#musicBtn.tocando{animation:giro 6s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
#ytwrap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#barra-inf{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);z-index:119;pointer-events:none}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.logo-nome{display:block;width:80%;max-width:300px;height:auto;margin:10px auto}
.logo-nome.branca{filter:brightness(0) invert(1)}
.presente-lista{margin-top:22px}
.presente-lista p{padding:14px 0;border-bottom:1px solid var(--rosa)}
.presente-lista p:last-child{border-bottom:none}
.pix{margin-top:30px;padding:30px 18px;border:1px solid var(--antigo);background:var(--card)}
.pix .sub{font-size:.9rem}
.pix-num{font-family:Arial,Helvetica,sans-serif;font-size:clamp(1.9rem,8vw,2.6rem);font-weight:700;letter-spacing:.06em;color:var(--textoForte);margin:10px 0 20px}
.deslize{margin-top:26px;display:flex;flex-direction:column;align-items:center}
.deslize span{font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.deslize svg{width:32px;height:32px;margin-top:4px;animation:desce 1.6s ease-in-out infinite}
@keyframes desce{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(6px);opacity:1}}
@supports not (aspect-ratio:1/1){
  .carrossel{height:0;padding-top:133.33%}
  .foto{height:400px}
}
</style>
</head>

<script>

   ████████████████████████████████████████████████████████████████████████████

   Cada seção do convite tem um bloco numerado abaixo, na ordem em que aparece no site.
   Dentro de cada bloco, as linhas são agrupadas pelos ícones:

     ✏️  TEXTOS      → o que está escrito no convite
     🖼️  IMAGENS     → links de fotos, logos e fundos (.png .jpg .gif)
     🎬  VÍDEOS      → links ou nomes de arquivos .mp4
     🌸  RENDA       → link do PNG de renda (enfeite repetido no topo/base da seção)
     🎨  CORES       → cores em hexadecimal, ex.: "#8A4E5B"

     🎵  MÚSICA      → música de fundo

   Regras gerais (valem para TODAS as seções):
     • Para trocar algo, mexa só no que está entre aspas "…". Não apague vírgulas nem aspas.
     • "" (aspas vazias) = não usar / deixar em branco.
     • Arquivo na mesma pasta do site → escreva só o nome:  "VideoMariaVitoria02.mp4"
     • Arquivo na internet (GitHub etc.) → cole o link inteiro:  "https://…/foto.png?raw=true"
     • fundo  = imagem OU vídeo de fundo da seção.
     • cor    = cor de fundo da seção ("" = cor padrão).
     • veu    = de 0 a 1: camada de cor sobre o fundo para o texto ficar legível.
     • renda  = PNG de renda no topo/base da seção ("" = sem renda).
   ============================================================================ */
const CONFIG = {

/* ┌──────────────────────────────────────────────────────────────────────────┐
   │ 0️⃣  GERAL — nome, hashtag, cores do site, fontes, música                │
   └──────────────────────────────────────────────────────────────────────────┘ */

  // ✏️ TEXTOS

  rendaAltura: 24,             // altura mínima (px)
  rendaAlturaMax: 110,         // altura máxima (px)
  rendaTile: 360,              // largura de cada repetição (px) — aumente para rendas maiores

    claro:       "#F1CCD4",   // rosa claro
    rosa:        "#E6A9BA",
    antigo:      "#D299A2",   // linhas e detalhes
    salmao:      "#E3A1A8",
    enfase:      "#FBF3F5",   // vinho: títulos, botões
    texto:       "#5E2F3A",
    textoSuave:  "#85535F",
    textoClaro:  "#FFF7F8",   // texto sobre fundo escuro

    textoMedio:  "#4A2530"    // texto de parágrafos

  // 🔤 FONTES — nomes do Google Fonts (https://fonts.google.com). Use fontes que tenham pesos 400 a 800.

    arquivoScript: ""             // (opcional) arquivo de fonte próprio para o script

/* ┌──────────────────────────────────────────────────────────────────────────┐

  abertura: {
    usar: true,                // true = mostra a abertura | false = pula direto para o convite
    // 🖼️ IMAGEM da abertura (com o monograma MV)

/* No GitHub Pages usa os arquivos da própria pasta do site e codifica espaços nos nomes locais */
(function (o) {
  var pages = /\.github\.io$/i.test(location.hostname);
  var rx = /^https:\/\/github\.com\/[^\/]+\/[^\/]+\/(?:blob|raw)\/[^\/]+\/(.+?)(?:\?raw=true)?$/i;
  var ext = /\.(png|jpe?g|gif|webp|svg|mp4|webm|mov|m4v|mp3|woff2?|ttf|otf)$/i;
  (function walk(x) {
    for (var k in x) {
      var v = x[k];
      if (typeof v === 'string') {
        var m = pages ? v.match(rx) : null;
        if (m) x[k] = m[1];
        else if (!/^(https?:|data:|\/\/)/i.test(v) && ext.test(v)) x[k] = encodeURI(v);
      } else if (v && typeof v === 'object') walk(v);
    }
  })(o);
})(CONFIG);

};

function alturaRenda(w, h, min, max) { return Math.round(Math.min(max, Math.max(min, (C.rendaTile || 360) * h / w))); }
function ajustarRendas() {

/* renda da galeria: FAIXA (bem mais larga que alta) vira topo + base + laterais; MOLDURA inteira fica por cima */
function galRenda(img) {

  if (img.naturalWidth / img.naturalHeight > 1.5) {

    const st = `background-image:url('${img.src}')`;

};
const tit = (t, s) => `${s ? `<p class="sub">${s}</p>` : ''}<h2>${String(t).replace(/\n/g, '<br>')}</h2><div class="orn">♥</div>`;
const ICONE_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3.2 3.2 5.8-6.4"/></svg>`;

const capa = `<header class="hero" id="inicio"${corSec(C.capa)}>${fundoHTML(C.capa, 'var(--fundo)')}${rendaHTML(C.capa)}
  <div class="capa-card">
    <p class="sub">${C.capa.celebracao.replace(/\n/g, '<br>')}</p>
    ${nomeHTML('nome')}
    <p class="frase">“${C.capa.frase}”</p>
    <div class="orn">♥</div>
    <p class="data data-capa">${dataTexto}</p>
    <p class="sub" style="margin-top:6px">${C.cidade}</p>
    ${C.deslize && C.deslize.texto ? `<div class="deslize" style="color:${C.deslize.cor || '#1F3A2A'}"><span>${C.deslize.texto}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>` : ''}
  </div></header>`;

/* Mensagem: logo + texto + vídeo (ou foto) */
const M = C.mensagem;
if (M) sec('convite', 'Convite', `${(M.usarLogo !== false && (M.logo || C.logoNome)) ? `<img class="logo-nome" src="${M.logo || C.logoNome}" alt="${C.nome}"><div class="orn">♥</div>` : tit(M.titulo)}<p class="texto" style="margin-top:${M.textoEspaco != null ? M.textoEspaco : 28}px">${M.texto}</p>${M.video
  ? `<div class="video-frame"><video id="videoMaria" src="${M.video}#t=0.1" ${M.poster ? `poster="${M.poster}"` : ''} controls controlsList="nodownload" playsinline webkit-playsinline preload="metadata" onerror="this.parentNode.style.display='none'"></video></div>`
  : (M.foto ? `<img class="foto" src="${M.foto}" alt="${C.nome}">` : '')}`);

if (C.contagem) sec('contagem', 'Contagem', `<p class="sub">${C.contagem.subtitulo || ''}</p><h2>${C.contagem.titulo}</h2><div id="cd" class="cd" style="margin-top:22px"></div>`, 'escuro');

const P = C.programacao;
if (P) {
  const itens = P.itens || ev.map(e => { const d = new Date(e.dataHora); return { hora: hora(d), dia: fm(d, { day: '2-digit', month: 'short' }).replace('.', ''), titulo: e.titulo, descricao: e.espaco + (e.obs ? `<em>${e.obs}</em>` : '') }; });
  sec('dia', 'Programação', `${tit(P.titulo, P.subtitulo)}<div class="tl">${itens.map(i => `<div class="tl-i"><div class="tl-h">${i.hora}<small>${i.dia || ''}</small></div><div class="tl-d">♥</div><div class="tl-t"><b>${i.titulo}</b><span>${i.descricao || ''}</span></div></div>`).join('')}</div>`);
}

const GA = C.galeria, fotosG = GA ? (GA.fotos || []).filter(Boolean) : [];
if (fotosG.length) sec('galeria', 'Galeria', `${tit(GA.titulo || 'Galeria')}
  <div class="gal-wrap${GA.rendaMoldura ? ' com-renda' : ''}" style="--fh:${GA.rendaFaixaAltura || 28}px"><div class="carrossel">${fotosG.map((g, i) => `<div class="slide${i ? '' : ' ativo'}"><img src="${g}" alt="Foto ${i + 1}" loading="lazy"></div>`).join('')}
  ${fotosG.length > 1 ? `<div class="pontos">${fotosG.map((_, i) => `<i class="${i ? '' : 'ativo'}"></i>`).join('')}</div>` : ''}</div>
  ${GA.rendaMoldura ? `<img class="gal-renda" src="${GA.rendaMoldura}" alt="" style="--esc:${GA.escalaMoldura || 1.3}" onload="galRenda(this)">` : ''}</div>`, 'alt');

if (C.local) sec('local', 'Local', tit(C.local.titulo) + ev.map(e => {
  const d = new Date(e.dataHora), q = [e.espaco, e.endereco, C.cidade].filter(Boolean).join(' ');
  return `<div class="ev-card"${corSec(e)}>${fundoHTML(e, 'var(--secaoAlt)')}<div class="ev-conteudo"><p class="sub">${e.titulo}</p><h3 class="ev-nome">${e.espaco}</h3>
    <p class="data">${cap(fm(d, { weekday: 'long' }))}, ${fm(d, { day: 'numeric', month: 'long' })} · ${hora(d)}</p>
    ${e.endereco ? `<p class="texto" style="margin-top:6px">${e.endereco}</p>` : ''}
    <a class="btn" style="margin-top:16px" href="${e.mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + enc(q)}" target="_blank" rel="noopener">Como chegar</a></div></div>`;
}).join(''), 'alt');

const D = C.dressCode, coresD = D ? (D.cores || []).filter(Boolean) : [];
if (D && (D.texto || coresD.length)) sec('traje', 'Traje', `${tit(D.titulo)}${D.texto ? `<p class="texto">${D.texto}</p>` : ''}${coresD.length ? `<div class="cores">${coresD.map(c => `<i style="background:${c}"></i>`).join('')}</div>` : ''}`);

const H = C.hospedagem;
if (H) sec('hospedagem', 'Hospedagem', `${tit(H.titulo)}<p class="texto">${H.texto}</p>` + H.lista.map(h => `<div class="ev">${h.imagem ? `<img src="${h.imagem}" alt="${h.nome}" style="margin-bottom:14px">` : ''}<h3>${h.nome}</h3><a class="btn" style="margin-top:14px" href="${h.link}" target="_blank" rel="noopener">${h.botao || 'Saiba mais'}</a></div>`).join(''));

const G = C.presentes;
if (G && (G.texto || (G.itens || []).length || G.pix)) sec('presentes', 'Presentes', `${tit(G.titulo, G.subtitulo)}${G.texto ? `<p class="texto">${G.texto}</p>` : ''}${(G.itens || []).length ? `<div class="presente-lista">${G.itens.map(i => `<p class="texto">${i}</p>`).join('')}</div>` : ''}${G.pix ? `<div class="pix"><p class="sub">Chave Pix</p><p class="data pix-num">${G.pixTexto || G.pix}</p><button class="btn" id="copiarPix" type="button">Copiar chave</button></div>` : ''}`, 'alt');

/* Confirmar presença: nome + acompanhantes → WhatsApp */
const R = C.rsvp;
if (R) sec('confirmar', 'Confirmar', `${tit(R.titulo)}
  <div class="rsvp-ico" aria-hidden="true">${R.iconeImagem ? `<img src="${R.iconeImagem}" alt="">` : ICONE_OK}</div>
  <p class="texto" style="margin:18px 0 8px">${R.instrucao}</p>
  <div class="rsvp-form">
    <label for="rsvpNome">${R.rotuloNome}</label>
    <input id="rsvpNome" type="text" autocomplete="name" placeholder="${R.placeholderNome}">
    <label for="rsvpAcomp">${R.rotuloAcomp}</label>
    <textarea id="rsvpAcomp" rows="3" placeholder="${R.placeholderAcomp}"></textarea>
    <p class="rsvp-erro" id="rsvpErro" hidden>${R.avisoNome}</p>
    <button class="btn" id="rsvpEnviar" type="button">${R.botao}</button>
  </div>`, 'alt');

$('#app').innerHTML = capa + secoes.join('') + `<footer>${rendaHTML(C.rodape)}${nomeHTML('script', true, C.logoRodape)}<p>${C.hashtag}</p></footer>`;

window.__pronto = true;

/* copiar chave Pix */
const cp = $('#copiarPix');
if (cp) cp.onclick = () => {
  const txt = C.presentes.pix, ok = () => { cp.textContent = 'Chave copiada!'; setTimeout(() => { cp.textContent = 'Copiar chave'; }, 2500); };
  const alt = () => { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, alt); else alt();
};

/* confirmar presença → abre o WhatsApp com a mensagem pronta */
const envia = $('#rsvpEnviar');
if (envia) envia.onclick = () => {
  const nome = $('#rsvpNome').value.trim(), acomp = $('#rsvpAcomp').value.trim().replace(/\n+/g, ', '), erro = $('#rsvpErro');
  if (!nome) { erro.hidden = false; $('#rsvpNome').focus(); return; }
  erro.hidden = true;
  const msg = (R.mensagemWhats || '').replace('{nome}', () => nome).replace('{acompanhantes}', () => acomp || 'sem acompanhantes'),
    num = (R.whatsapp || '').replace(/\D/g, '');
  window.open('https://wa.me/' + num + '?text=' + enc(msg), '_blank');
};

/* vídeo da mensagem: ao dar play, a música de fundo pausa; ao pausar/terminar, ela volta */
const vm = $('#videoMaria');
if (vm) {
  let retomar = false;
  vm.addEventListener('play', () => { if (tocando) { retomar = true; pausar(); } });
  const volta = () => { if (vm.seeking || !retomar) return; retomar = false; tocar(); };
  vm.addEventListener('pause', volta);
  vm.addEventListener('ended', volta);
}

try { ajustarRendas(); } catch (e) {}

/* vídeos de fundo que tocam uma vez só: começam quando a seção aparece e param no último quadro */
document.querySelectorAll('video[data-uma-vez]').forEach(v => {
  v.muted = true;
  const play = () => v.play().catch(() => {});
  const antes = parseFloat(v.dataset.antes) || 0;
  if (antes) {
    let vigia = false;
    const checar = () => {
      if (v.paused || v.ended) { vigia = false; return; }
      if (v.duration && v.currentTime >= v.duration - antes) { v.pause(); vigia = false; return; }
      requestAnimationFrame(checar);
    };
    v.addEventListener('playing', () => { if (!vigia) { vigia = true; requestAnimationFrame(checar); } });
    v.addEventListener('ended', () => { if (v.duration) { v.currentTime = Math.max(0, v.duration - antes - 0.05); v.pause(); } });
  }
  if ('IntersectionObserver' in window) {
    const o = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { play(); o.disconnect(); } }), { threshold: .35 });
    o.observe(v.closest('section') || v);
  } else play();
});

/* Animações de entrada e contagem */
const rvs = document.querySelectorAll('.wrap, footer');
rvs.forEach(e => e.classList.add('rv'));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  rvs.forEach(e => io.observe(e));
} else rvs.forEach(e => e.classList.add('in'));

function contagem() {
  const el = $('#cd'); if (!el) return;
  const dif = d0 - new Date();
  if (dif <= 0) { el.innerHTML = '<span style="font-size:.8rem">É HOJE!</span>'; return; }
  const n = [Math.floor(dif / 864e5), Math.floor(dif % 864e5 / 36e5), Math.floor(dif % 36e5 / 6e4), Math.floor(dif % 6e4 / 1e3)];
  el.innerHTML = n.map((v, i) => `<div><b>${String(v).padStart(2, '0')}</b><span>${['dias', 'horas', 'min', 'seg'][i]}</span></div>`).join('');
}
contagem(); setInterval(contagem, 1000);

/* Galeria: troca automática de fotos */
const slides = document.querySelectorAll('.slide'), pontos = document.querySelectorAll('.pontos i'); let cur = 0;
if (slides.length > 1) setInterval(() => {
  slides[cur].classList.remove('ativo'); pontos[cur].classList.remove('ativo');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('ativo'); pontos[cur].classList.add('ativo');
}, 4000);
</script>
</body>
</html>
